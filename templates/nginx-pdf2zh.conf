# PDF翻訳(pdf2zh)のGUIを社内に公開する。【要変更】server_name, 認証ファイルのパス
server {
    listen 80;
    server_name pdf-translate.example.local;

    # 認証: pdf2zh 自体に認証はありません。必ずここで掛けてください
    auth_basic "PDF Translation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # PDFを上げるので既定の1MBでは足りません
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 長い文書は数分かかります。既定の60秒では切れます
        proxy_read_timeout 1800;
        proxy_send_timeout 1800;

        # GUI(Gradio)はWebSocketを使います
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
